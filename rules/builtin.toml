[[rules]]
id = "aws-access-key-id"
description = "AWS Access Key ID"
pattern = '(?i)\bAKIA[0-9A-Z]{16}\b'
keywords = ["AKIA"]

[[rules]]
id = "aws-secret-access-key"
description = "AWS Secret Access Key"
pattern = "(?i)(?:aws_secret_access_key|aws_secret)\\s*[=:]\\s*[\"']?([A-Za-z0-9/+=]{40})[\"']?"
keywords = ["aws_secret"]

[[rules]]
id = "github-token"
description = "GitHub Personal Access Token"
pattern = '\b(ghp_[A-Za-z0-9]{36}|github_pat_[A-Za-z0-9_]{82})\b'
keywords = ["ghp_", "github_pat_"]

[[rules]]
id = "github-oauth"
description = "GitHub OAuth Access Token"
pattern = '\bgho_[A-Za-z0-9]{36}\b'
keywords = ["gho_"]

[[rules]]
id = "generic-api-key"
description = "Generic API Key assignment"
pattern = "(?i)(?:api[_-]?key|apikey)\\s*[=:]\\s*[\"']?([A-Za-z0-9_\\-]{20,})[\"']?"
keywords = ["api_key", "apikey", "api-key"]

[[rules]]
id = "private-key"
description = "Private Key (PEM)"
pattern = '-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----'
keywords = ["PRIVATE KEY"]

[[rules]]
id = "jwt"
description = "JSON Web Token"
pattern = '\beyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\b'
keywords = ["eyJ"]

[[rules]]
id = "generic-secret"
description = "Generic Secret assignment"
pattern = "(?i)(?:secret|password|passwd|token)\\s*[=:]\\s*[\"']?([A-Za-z0-9_\\-/+=]{8,})[\"']?"
keywords = ["secret", "password", "token"]
