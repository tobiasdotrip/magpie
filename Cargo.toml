[package]
name = "magpie"
version = "0.5.0"
edition = "2021"
description = "Fast git secret scanner"
license = "MIT OR Apache-2.0"
repository = "https://github.com/tobiasdotrip/magpie"
readme = "README.md"
keywords = ["security", "secrets", "scanner", "git", "cli"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4", features = ["derive"] }
git2 = "0.21"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
owo-colors = "4"
globset = "0.4"
rusqlite = { version = "0.40", features = ["bundled"] }
chrono = "0.4"

[dev-dependencies]
tempfile = "3"
